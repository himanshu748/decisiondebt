name: External public browser probe
on:
  workflow_dispatch:
    inputs:
      url:
        description: Public DecisionDebt origin
        required: true
        default: http://decisiondebt.52.202.25.181.sslip.io:8081
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Fresh Chromium against the deployed public origin
        env:
          DD_BASE_URL: ${{ inputs.url }}
          DD_PROBE_OUTPUT: work/external-public
        run: node web/scripts/probe-public.mjs
      - name: Preserve screenshots, failures and browser receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: external-public-${{ github.run_id }}
          path: work/external-public
          retention-days: 14
