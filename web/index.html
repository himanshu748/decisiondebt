<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0e15" />
    <meta name="decisiondebt-mode" content="unknown" />
    <meta
      name="description"
      content="Preview the consequences of a decision through source-backed FalkorDB evidence. Aster Works is entirely synthetic."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>DecisionDebt | Decision studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <main
        style="
          min-height: 100svh;
          display: grid;
          place-items: center;
          padding: 24px;
          box-sizing: border-box;
          background: #0b0e15;
          color: #edf1f8;
          font-family: Geist, Arial, sans-serif;
        "
      >
        <section style="width: min(100%, 560px)">
          <h1>DecisionDebt</h1>
          <p style="line-height: 1.7; color: #bdc8da">
            The workspace hasn't opened yet. Retry this page, or watch the
            recorded demo.
          </p>
          <form
            method="get"
            style="display: inline-block; margin: 12px 20px 12px 0"
          >
            <button
              type="submit"
              style="
                min-height: 44px;
                padding: 10px 18px;
                background: #4264da;
                color: white;
                border: 1px solid #839ced;
                border-radius: 8px;
                font: inherit;
                cursor: pointer;
              "
            >
              Retry loading
            </button>
          </form>
          <a
            href="https://youtu.be/_a0vrYwOlME"
            style="
              display: inline-flex;
              align-items: center;
              min-height: 44px;
              color: #c2d0ff;
            "
            >Watch the recorded demo</a
          >
          <noscript
            ><p>JavaScript is needed to open the live workspace.</p></noscript
          >
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
